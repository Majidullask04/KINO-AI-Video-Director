version: "3.8"

services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: falkordb-director
    ports:
      - "6379:6379"
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - falkordb_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: director-backend
    ports:
      - "8000:8000"
    environment:
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
      - FALKORDB_GRAPH_NAME=ai_video_director
    depends_on:
      - falkordb
    restart: unless-stopped
    volumes:
      - ./backend/static:/app/backend/static

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: director-frontend
    ports:
      - "3001:3001"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  falkordb_data:
